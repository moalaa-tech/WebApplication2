<section class="page">
  <div class="page-head">
    <h2>Transactions</h2>
  </div>

  @if (loading()) {
    <p class="hint">Loading&hellip;</p>
  }

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }

  <div class="toolbar">
    <input
      class="search"
      type="search"
      placeholder="Filter by product ID"
      [value]="productId()"
      (input)="productId.set(($any($event.target)).value); load()"
    />
  </div>

  @if (loaded()) {
    <div class="key-value">
      <div class="kv">
        <span class="k">Filter</span>
        <span class="v">{{ productId().trim() || 'All products' }}</span>
      </div>
      <div class="kv">
        <span class="k">Status</span>
        <span class="v">Loaded successfully</span>
      </div>
    </div>
  }
</section>
